name: Visual regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update snapshot baselines instead of checking them"
        type: boolean
        default: false

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Render test fixtures
        run: npm run render:test

      - name: Run visual tests
        run: npx playwright test
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}

      - name: Upload animation videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload updated snapshot baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: tests/visual/**/*-snapshots/**
          retention-days: 30
